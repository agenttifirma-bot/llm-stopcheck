[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-stopcheck"
version = "0.1.0"
description = "Catch silent LLM failures: truncation, reasoning-budget exhaustion, empty output, content filters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tonyweckstrom1987" }]
keywords = ["llm", "openai", "litellm", "openrouter", "finish_reason", "max_tokens", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
]
dependencies = []

[project.scripts]
llm-stopcheck = "llm_stopcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
